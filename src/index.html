<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!--
  Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
      https://cordova.apache.org/docs/en/latest/
  Some notes:
    * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
    * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
      * Enable inline JS: add 'unsafe-inline' to default-src
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: content:">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fff">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <title>ChefPilot</title>
  <style>


      *:not(input):not(textarea) {
          /* 1. Disable text selection globally */
          -webkit-user-select: none;
          user-select: none;

          /* 2. Disable the gray "tap highlight" on iOS/Android */
          -webkit-tap-highlight-color: transparent;

          /* 3. Disable the long-press context menu (save image, copy link, etc) */
          -webkit-touch-callout: none;
      }

      /* Allow selection in inputs so users can actually type */
      input, textarea {
          -webkit-user-select: auto;
          user-select: auto;
      }

      /* 4. Disable image dragging (common on iOS) */
      img {
          -webkit-user-drag: none;
      }

      html, body {
          /* Prevent the whole page from bouncing/pull-to-refresh */
          overscroll-behavior: none;
          overflow: hidden;
          height: 100%;
      }

      /* Only allow scrolling in your main content area */
      .main-content {
          overflow-y: auto;
          -webkit-overflow-scrolling: touch; /* Smooth momentum scrolling */
      }
      body {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);

          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
  </style>
  
  
  
  <!-- built styles file will be auto injected -->
</head>
<body>
  <div id="app"></div>
  <script src="./js/scaledrone.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
